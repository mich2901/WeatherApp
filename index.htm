<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="32x32" href="./src/icons/day/cloudy.png">
    <title>Weather</title>
</head>
<body>
    <div class="weather-app">
        <div class="container">
            <h3 class="brand">The weather</h3>
            <div>
                <h1 class="temp">16&#176;</h1>
                <div class="city-time">
                    <h1 class="name">London</h1>
                    <small>
                        <span class="time">06:09</span>
                        <span class="date">
                            Monday Sep 19
                        </span>
                    </small>
                </div>
                <div class="weather">
                    <img src="./src/icons/day/clear.png" class="icon" alt="icon" width="50" height="50"/>
                    <span class="condition">Cloudy</span>
                </div>
            </div>
        </div>
        <div class="panel">
            <form id="locationInput">
                <input type="text" class="search" id="city" placeholder="Search City...">
                <input type="text" class="search" id="country" placeholder="Search Country...">
                <button type="submit" class="submit">
                    <img src="./src/icons/others/search.png" alt="icon" width="20" height="20">
                </button>
            </form>

            <ul class="cities">
                <li class="city">New York, USA</li>
                <li class="city">Paris, France</li>
                <li class="city">Grace, Italy</li>
                <li class="city">Lisbon, Portugal</li>
            </ul>

            <ul class="details">
                <h4>Weather Details</h4>
                <li>
                    <span>Cloudy</span>
                    <span class="cloud">89%</span>
                </li>
                <li>
                    <span>Humidity</span>
                    <span class="humidity">64%</span>
                </li>
                <li>
                    <span>Wind</span>
                    <span class="wind">8km/h</span>
                </li>
            </ul>
            <footer class="copyright">&copy; Michelle Devera 2024</footer>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
